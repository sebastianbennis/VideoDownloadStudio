<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VideoDownloadStudio</title>
    <link rel="stylesheet" href="./panel.css">
  </head>
  <body class="vds" data-theme="system" data-screen="media">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="i-refresh" viewBox="0 0 20 20"><path d="M15.5 10a5.5 5.5 0 1 1-1.7-4"/><path d="M14.2 2.8v3.6h-3.6"/></symbol>
      <symbol id="i-gear" viewBox="0 0 20 20"><path stroke-width="1.4" d="M15.84 8.63 L17.60 8.77 L17.60 11.23 L15.84 11.37 A6 6 0 0 1 15.10 13.16 L16.24 14.51 L14.51 16.24 L13.16 15.10 A6 6 0 0 1 11.37 15.84 L11.23 17.60 L8.77 17.60 L8.63 15.84 A6 6 0 0 1 6.84 15.10 L5.49 16.24 L3.76 14.51 L4.90 13.16 A6 6 0 0 1 4.16 11.37 L2.40 11.23 L2.40 8.77 L4.16 8.63 A6 6 0 0 1 4.90 6.84 L3.76 5.49 L5.49 3.76 L6.84 4.90 A6 6 0 0 1 8.63 4.16 L8.77 2.40 L11.23 2.40 L11.37 4.16 A6 6 0 0 1 13.16 4.90 L14.51 3.76 L16.24 5.49 L15.10 6.84 A6 6 0 0 1 15.84 8.63 Z"/><circle cx="10" cy="10" r="2.5" stroke-width="1.5"/></symbol>
      <symbol id="i-more" viewBox="0 0 20 20"><circle cx="4.5" cy="10" r="1.35" fill="currentColor" stroke="none"/><circle cx="10" cy="10" r="1.35" fill="currentColor" stroke="none"/><circle cx="15.5" cy="10" r="1.35" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-down" viewBox="0 0 20 20"><path d="M10 3.5v9"/><path d="M6 9l4 4 4-4"/><path d="M4.5 16.5h11"/></symbol>
      <symbol id="i-chev" viewBox="0 0 20 20"><path d="M6 8l4 4 4-4"/></symbol>
      <symbol id="i-fwd" viewBox="0 0 20 20"><path d="M8 5l5 5-5 5"/></symbol>
      <symbol id="i-link" viewBox="0 0 20 20"><path d="M8.5 11.5l3-3"/><path d="M9.4 6.4l1.3-1.3a3 3 0 0 1 4.2 4.2l-1.3 1.3"/><path d="M10.6 13.6l-1.3 1.3a3 3 0 0 1-4.2-4.2l1.3-1.3"/></symbol>
      <symbol id="i-film" viewBox="0 0 20 20"><rect x="3.5" y="4.5" width="13" height="11" rx="2"/><path d="M3.5 8h13M3.5 12h13M7.5 4.5v3.5M12.5 4.5v3.5M7.5 12v3.5M12.5 12v3.5"/></symbol>
      <symbol id="i-note" viewBox="0 0 20 20"><path d="M8 14.5V5l7.5-1.5v9"/><circle cx="6" cy="14.5" r="2"/><circle cx="13.5" cy="12.5" r="2"/></symbol>
      <symbol id="i-play" viewBox="0 0 20 20"><path d="M7 4.8v10.4c0 .5.5.8.9.5l8-5.2a.6.6 0 0 0 0-1l-8-5.2c-.4-.3-.9 0-.9.5z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-check" viewBox="0 0 20 20"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></symbol>
      <symbol id="i-x" viewBox="0 0 20 20"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></symbol>
      <symbol id="i-stop" viewBox="0 0 20 20"><rect x="5.5" y="5.5" width="9" height="9" rx="1.5"/></symbol>
      <symbol id="i-lock" viewBox="0 0 20 20"><rect x="4.5" y="9" width="11" height="8" rx="1.8"/><path d="M7 9V6.8a3 3 0 0 1 6 0V9"/></symbol>
      <symbol id="i-bang" viewBox="0 0 20 20"><path d="M10 5v6"/><circle cx="10" cy="14.6" r=".9" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-folder" viewBox="0 0 20 20"><path d="M3 6.5a1.5 1.5 0 0 1 1.5-1.5h3.2l1.6 1.8h6.2A1.5 1.5 0 0 1 17 8.3v6.2a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 14.5z"/></symbol>
      <symbol id="i-retry" viewBox="0 0 20 20"><path d="M4.5 10a5.5 5.5 0 1 0 1.7-4"/><path d="M5.8 2.8v3.6h3.6"/></symbol>
      <symbol id="i-doc" viewBox="0 0 20 20"><path d="M5.5 3h6l3.5 3.5V16a1 1 0 0 1-1 1h-8.5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M11.5 3v3.5H15"/></symbol>
    </svg>

    <header class="top">
      <div class="where">
        <span class="fav" id="siteMark" aria-hidden="true"></span>
        <b class="trunc" id="tabLabel">Ready</b>
      </div>
      <button id="scanButton" class="ib" type="button" data-title-label="scanAgain" title="Find videos on this page again" data-aria-label-key="findAgain" aria-label="Find Videos Again"><svg class="i"><use href="#i-refresh"/></svg></button>
      <button class="ib" type="button" data-view="settings" data-title-label="settings" title="Settings" data-aria-label-key="settings" aria-label="Settings"><svg class="i"><use href="#i-gear"/></svg></button>
      <details class="more-menu" id="moreMenu">
        <summary class="ib" data-title-label="more" title="More" data-aria-label-key="more" aria-label="More"><svg class="i"><use href="#i-more"/></svg></summary>
        <div class="menu">
          <button class="menu-item" type="button" id="scanMenuItem"><span data-label="findAgain">Find Videos Again</span></button>
          <button class="menu-item" type="button" id="pasteMenuItem"><span data-label="pasteLinkMenu">Paste a Link…</span><span class="key" aria-hidden="true">⌘V</span></button>
          <div class="menu-sep"></div>
          <button class="menu-item" type="button" id="grantButton"><span data-label="allowThisSite">Allow This Site</span></button>
          <button class="menu-item" type="button" id="grantAllButton"><span data-label="allowAllWebsites">Allow All Websites…</span></button>
          <div class="menu-sep"></div>
          <button class="menu-item" type="button" id="settingsMenuItem"><span data-label="settingsMenu">Settings…</span><span class="key" aria-hidden="true">⌘,</span></button>
        </div>
      </details>
    </header>

    <nav class="tabs" aria-label="Views">
      <button class="tab active" type="button" data-label="media" data-view="media">On this page</button>
      <button class="tab" type="button" data-label="jobs" data-view="jobs">Downloads</button>
    </nav>

    <section id="mediaView" class="view active list" aria-label="On this page">
      <div id="candidateList"></div>
      <form id="manualForm" class="paste">
        <svg class="i"><use href="#i-link"/></svg>
        <input aria-label="Media URL" data-aria-label-key="mediaUrl" id="manualUrl" type="url" placeholder="Paste a video link" data-placeholder-label="manualUrlPlaceholder" autocomplete="off">
        <button type="submit" data-label="add">Add</button>
      </form>
    </section>

    <section id="jobsView" class="view list" aria-label="Downloads">
      <div id="jobList"></div>
      <h3 class="label" id="historyLabel"><span data-label="earlier">Earlier</span><button id="clearHistory" class="link" type="button" data-label="clearHistory">Clear History</button></h3>
      <div id="historyList"></div>
    </section>

    <section id="settingsView" class="view" aria-labelledby="settingsTitle">
      <header class="settings-head">
        <h2 id="settingsTitle" data-label="settings">Settings</h2>
        <span class="saved" id="savedNote" aria-live="polite"></span>
        <button id="settingsDone" class="btn is-primary" type="button" data-label="done" style="height:28px;padding:0 14px;font-size:13px">Done</button>
      </header>
      <form id="settingsForm" class="list">
        <h3 class="label" data-label="saving">Saving</h3>
        <div class="group">
          <label class="field"><span><span data-label="subdirectory">Folder in Downloads</span><small data-label="subdirectoryHelp">Leave empty to save straight to Downloads</small></span><input name="subdirectory" type="text" placeholder="None" data-placeholder-label="subdirectoryPlaceholder"></label>
          <label class="field"><span data-label="preferredHeight">Preferred quality</span>
            <select name="preferredHeight">
              <option value="4320">4320p 8K</option>
              <option value="2160">2160p 4K</option>
              <option value="1440">1440p</option>
              <option value="1080">1080p</option>
              <option value="720">720p</option>
              <option value="480">480p</option>
              <option value="360">360p</option>
              <option value="240">240p</option>
              <option value="144">144p</option>
            </select>
          </label>
          <label class="field"><span><span data-label="container">Format</span><small data-label="containerHelp">For converted streams. Long HLS saves keep their native format.</small></span>
            <select name="preferredContainer">
              <option value="mp4">MP4</option>
              <option value="mkv">MKV</option>
              <option value="ts">MPEG-TS</option>
            </select>
          </label>
          <label class="field"><span data-label="concurrentDownloads">Downloads at once</span><input name="concurrentDownloads" type="number" min="1" max="6"></label>
        </div>
        <h3 class="label" data-label="whenIClickDownload">When I click Download</h3>
        <div class="group">
          <label class="field"><span data-label="defaultAction">Download button</span>
            <select name="defaultAction">
              <option value="download" data-label="defaultActionDownload">Saves video and sound</option>
              <option value="download-as" data-label="defaultActionDownloadAs">Asks where to save</option>
              <option value="audio" data-label="defaultActionAudio">Saves sound only</option>
              <option value="copy" data-label="defaultActionCopy">Copies the link</option>
            </select>
          </label>
          <div class="field" id="siteDefault" hidden><small id="siteDefaultText"></small><button type="button" class="link" id="siteDefaultReset" data-label="siteDefaultReset">Reset</button></div>
        </div>
        <h3 class="label" data-label="lookAndHistory">Look and history</h3>
        <div class="group">
          <label class="field"><span data-label="theme">Theme</span>
            <select name="theme">
              <option value="system" data-label="system">Same as system</option>
              <option value="light" data-label="light">Light</option>
              <option value="dark" data-label="dark">Dark</option>
            </select>
          </label>
          <label class="field"><span><span data-label="dock">Open as</span><small data-label="dockHelp">What the toolbar button opens</small></span>
            <select name="dock">
              <option value="popup" data-label="popup">Popup</option>
              <option value="side-panel" data-label="sidePanel">Side Panel</option>
            </select>
          </label>
          <label class="field"><span><span data-label="historyDays">Keep history for</span><small data-label="historyDaysHelp">0 keeps nothing</small></span><input name="historyDays" type="number" min="0" max="365"><span style="flex:none;color:var(--ink-2)" data-label="days">days</span></label>
          <label class="field"><span data-label="desktopNotifications">Tell me when a download finishes</span><span class="switch"><input name="desktopNotifications" type="checkbox"><i></i></span></label>
        </div>
        <details class="advanced" id="advancedSettings">
          <summary><svg class="i"><use href="#i-fwd"/></svg><span data-label="advanced">Advanced</span></summary>
          <label><span data-label="namingRules">File naming rules (JSON)</span><textarea name="namingRules" rows="4" spellcheck="false" placeholder='{"template":"{title}-{date}"}'></textarea></label>
          <label><span data-label="customLabelTranslations">Custom labels (JSON)</span><textarea name="translations" rows="3" spellcheck="false" placeholder='{"download":"Download"}'></textarea></label>
        </details>
      </form>
    </section>

    <footer id="band" class="band" data-float hidden>
      <button class="band-open" type="button" data-title-label="showDownloads" title="Show downloads" data-aria-label-key="showDownloads" aria-label="Show Downloads"></button>
      <div class="print" id="bandPrint"><div class="img"></div></div>
      <div class="band-text"><small class="trunc" id="bandSmall"></small><b class="trunc" id="bandTitle"></b></div>
      <span class="pct" id="bandPct"></span>
      <button class="ib" type="button" id="bandReveal" hidden><svg class="i"><use href="#i-folder"/></svg></button>
    </footer>

    <footer class="creator-footer">
      <span><span data-label="builtBy">Built by</span> <a href="https://x.com/sebastianbennis" target="_blank" rel="noopener noreferrer" data-aria-label-key="creatorX" aria-label="Sebastian Bennis on X (opens in a new tab)">@sebastianbennis</a></span>
      <span aria-hidden="true">·</span>
      <a href="https://github.com/sebastianbennis" target="_blank" rel="noopener noreferrer" data-aria-label-key="creatorGitHub" aria-label="Sebastian Bennis on GitHub (opens in a new tab)">GitHub <span aria-hidden="true">↗</span></a>
    </footer>

    <section id="notice" class="notice hidden" role="status"></section>


    <script type="module" src="./panel.js"></script>
  </body>
</html>
